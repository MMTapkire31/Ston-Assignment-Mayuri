name: STON RN CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx eslint src/ --ext .js,.jsx,.ts,.tsx

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx jest --passWithNoTests --coverage

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx expo export --platform android

  server:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Start mock server and health-check
        run: |
          npm run server &
          sleep 3
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/drives)
          echo "GET /api/drives returned $code"
          [ "$code" = "200" ] || [ "$code" = "401" ]

  notify:
    runs-on: ubuntu-latest
    needs: [lint, test, build, server]
    if: always()
    steps:
      - name: Write pipeline summary
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            STATUS="FAILED"
          else
            STATUS="PASSED"
          fi
          echo "## STON RN CI Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "Result: $STATUS" >> $GITHUB_STEP_SUMMARY
          echo "lint: ${{ needs.lint.result }} | test: ${{ needs.test.result }} | build: ${{ needs.build.result }} | server: ${{ needs.server.result }}" >> $GITHUB_STEP_SUMMARY
